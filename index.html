<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Voice Support Dialog Generator</title>

<link rel="stylesheet" href="estilos.css">

<script src="incidentes.js"></script>
"></script>

</head>

<body>

<div class="container">

<h1>Voice Support Dialog Generator</h1>

<label>Tipo de Caso</label>

<select id="tipo" onchange="cargarAcciones()">
    <option value="">Seleccione...</option>
    <option value="incidente">Incidente</option>
    <option value="requerimiento">Requerimiento</option>
</select>

<label>Actividad</label>

<select id="accion" onchange="mostrarCampos()">
    <option value="">Seleccione...</option>
</select>

<div id="camposDinamicos"></div>

<label>Idioma</label>

<select id="idioma">
    <option value="es">Español</option>
    <option value="pt">Português</option>
    <option value="en">English</option>
</select>

<button onclick="generar()">Generar</button>
<button onclick="copiarTexto()">Copiar</button>

<label>Resultado</label>

<textarea id="resultado"></textarea>

</div>

<script>

function cargarAcciones() {

    let tipo = document.getElementById("tipo").value;

    let data =
        tipo === "incidente"
        ? INCIDENTES
        : REQUERIMIENTOS;

    let accion = document.getElementById("accion");

    accion.innerHTML =
        '<option value="">Seleccione...</option>';

    for (let key in data) {

        let op = document.createElement("option");

        op.value = key;
        op.textContent = data[key].nombre;

        accion.appendChild(op);
    }

    document.getElementById("camposDinamicos").innerHTML = "";
}

function mostrarCampos() {

    let tipo = document.getElementById("tipo").value;

    let accion = document.getElementById("accion").value;

    if (!accion) return;

    let data =
        tipo === "incidente"
        ? INCIDENTES
        : REQUERIMIENTOS;

    let html = "";

    data[accion].campos.forEach(campo => {

        html += `
            <label>${formatearNombreCampo(campo)}</label>
            <input type="text" id="${campo}">
        `;
    });

    document.getElementById("camposDinamicos").innerHTML = html;
}

function generar() {

    let tipo = document.getElementById("tipo").value;

    let accion = document.getElementById("accion").value;

    let idioma = document.getElementById("idioma").value;

    if (!tipo || !accion) {

        alert("Seleccione Tipo de Caso y Actividad");

        return;
    }

    let data =
        tipo === "incidente"
        ? INCIDENTES
        : REQUERIMIENTOS;

    let texto = data[accion].idiomas[idioma];

    data[accion].campos.forEach(campo => {

        let valor =
            document.getElementById(campo).value;

        texto =
            texto.replaceAll(
                `{${campo}}`,
                valor
            );

    });

    document.getElementById("resultado").value =
        texto;
}

function copiarTexto() {

    let texto =
        document.getElementById("resultado");

    texto.select();

    navigator.clipboard.writeText(
        texto.value
    );

    alert("Mensaje copiado");
}

function formatearNombreCampo(campo) {

    const nombres = {

        nombre: "Nombre destinatario",
        cs: "Número de CS",
        inicio: "Fecha / Hora Inicio",
        fin: "Fecha / Hora Fin",
        problema: "Problema",
        resolucion: "Resolución"

    };

    return nombres[campo] || campo;
}

</script>

</body>

</html>
